name: River Permit Monitor

on:
  schedule:
    # Runs every 15 minutes (GitHub's minimum dependable cron window)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows you to force run it manually via the GitHub website

jobs:
  check-permits:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Tracker Script
      run: python rubynotifier.py
